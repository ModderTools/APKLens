<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8fb3b1" />
  <title>Developer Info</title>

  <style>
    :root {
      /* Palette sampled/inspired from the provided favicon */
      --bg-1: #eef4f2;
      --bg-2: #dce8e5;
      --accent: #8fb3b1;
      --accent-2: #6f9d99;
      --accent-3: #b9d5d1;
      --accent-soft: rgba(143, 179, 177, .14);
      --text: #253637;
      --muted: #6f8081;
      --card: rgba(255, 255, 255, .95);
      --line: rgba(111, 157, 153, .22);
      --shadow: 0 28px 80px rgba(53, 83, 82, .20);
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      overflow-x: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 12%, rgba(255,255,255,.95), transparent 28%),
        radial-gradient(circle at 86% 84%, rgba(143,179,177,.28), transparent 32%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(4px);
      opacity: .32;
      animation: floatBlob 8s ease-in-out infinite;
    }

    body::before {
      top: -65px;
      left: -60px;
      background: radial-gradient(circle, var(--accent-3), transparent 68%);
    }

    body::after {
      right: -55px;
      bottom: -70px;
      background: radial-gradient(circle, var(--accent), transparent 68%);
      animation-delay: -3s;
    }

    @keyframes floatBlob {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(12px, -14px, 0) scale(1.08); }
    }

    button,
    a {
      font: inherit;
    }

    .demo-trigger {
      position: relative;
      z-index: 1;
      border: 0;
      color: white;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      padding: 14px 22px;
      border-radius: 16px;
      font-weight: 850;
      letter-spacing: .01em;
      cursor: pointer;
      box-shadow: 0 14px 34px rgba(93, 136, 133, .28);
      transition: transform .22s ease, box-shadow .22s ease;
      overflow: hidden;
    }

    .demo-trigger::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-120%);
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.34), transparent);
      animation: buttonShine 3.5s ease-in-out infinite;
    }

    @keyframes buttonShine {
      0%, 55% { transform: translateX(-120%); }
      72%, 100% { transform: translateX(120%); }
    }

    .demo-trigger:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(93, 136, 133, .34);
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(24, 39, 39, .40);
      backdrop-filter: blur(11px);
      -webkit-backdrop-filter: blur(11px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s ease, visibility .3s ease;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .dialog {
      position: relative;
      width: min(100%, 430px);
      max-height: 92vh;
      overflow: auto;
      padding: 24px;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid rgba(255,255,255,.9);
      box-shadow: var(--shadow);
      transform: translateY(24px) scale(.94) rotateX(5deg);
      opacity: 0;
      transition: transform .42s cubic-bezier(.16,.84,.24,1), opacity .25s ease;
    }

    .overlay.show .dialog {
      transform: translateY(0) scale(1) rotateX(0);
      opacity: 1;
    }

    .dialog::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 1px;
      border-radius: inherit;
      background: linear-gradient(135deg,
        rgba(255,255,255,.96),
        rgba(143,179,177,.45),
        rgba(255,255,255,.96)
      );
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      animation: borderMove 5s linear infinite;
    }

    @keyframes borderMove {
      0% { opacity: .65; filter: hue-rotate(0deg); }
      50% { opacity: 1; filter: hue-rotate(12deg); }
      100% { opacity: .65; filter: hue-rotate(0deg); }
    }

    .close {
      position: absolute;
      top: 13px;
      right: 13px;
      z-index: 2;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      color: var(--text);
      background: rgba(143,179,177,.12);
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
      transition: transform .2s ease, background .2s ease;
    }

    .close:hover {
      transform: rotate(90deg) scale(1.06);
      background: rgba(143,179,177,.22);
    }

    .header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 7px 36px 2px;
    }

    .logo-wrap {
      position: relative;
      width: 98px;
      height: 98px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
    }

    .logo-glow {
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(143,179,177,.34), transparent 65%);
      animation: glowPulse 2.8s ease-in-out infinite;
    }

    .logo-orbit {
      position: absolute;
      inset: -7px;
      border-radius: 30px;
      border: 1.5px dashed rgba(111,157,153,.46);
      animation: orbitSpin 8s linear infinite;
    }

    .logo-orbit::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      top: 6px;
      left: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 12px rgba(111,157,153,.65);
    }

    @keyframes glowPulse {
      0%, 100% { transform: scale(.92); opacity: .55; }
      50% { transform: scale(1.12); opacity: .95; }
    }

    @keyframes orbitSpin {
      to { transform: rotate(360deg); }
    }

    .logo {
      position: relative;
      width: 92px;
      height: 92px;
      display: block;
      object-fit: cover;
      border-radius: 25px;
      border: 1px solid rgba(111,157,153,.23);
      box-shadow: 0 14px 34px rgba(71, 103, 102, .20);
      animation: logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(1deg); }
    }

    .eyebrow {
      margin-bottom: 7px;
      color: var(--accent-2);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 5px;
      font-size: clamp(25px, 7vw, 33px);
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    .role {
      color: var(--muted);
      font-size: 14px;
      font-weight: 720;
    }

    .bio {
      position: relative;
      z-index: 1;
      margin: 20px 0 19px;
      padding: 16px 15px;
      border-radius: 19px;
      background: linear-gradient(135deg, rgba(185,213,209,.18), rgba(143,179,177,.08));
      border: 1px solid var(--line);
      color: #526768;
      text-align: center;
      font-size: 14px;
      line-height: 1.65;
    }

    .section-title {
      position: relative;
      z-index: 1;
      margin: 0 0 10px 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .info-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .info-card {
      min-width: 0;
      padding: 13px;
      border-radius: 17px;
      background: rgba(255,255,255,.68);
      border: 1px solid var(--line);
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .info-card:hover {
      transform: translateY(-2px);
      border-color: rgba(111,157,153,.42);
      box-shadow: 0 8px 20px rgba(71,103,102,.08);
    }

    .label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .value {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13px;
      font-weight: 850;
    }

    .links {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .link-btn {
      min-height: 47px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 12px;
      border-radius: 15px;
      text-decoration: none;
      color: var(--text);
      background: rgba(255,255,255,.82);
      border: 1px solid var(--line);
      font-size: 13px;
      font-weight: 850;
      overflow: hidden;
      position: relative;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .link-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-120%);
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.42), transparent);
      animation: linkShine 4.2s ease-in-out infinite;
    }

    .link-btn:nth-child(2)::after { animation-delay: .65s; }

    @keyframes linkShine {
      0%, 60% { transform: translateX(-120%); }
      78%, 100% { transform: translateX(120%); }
    }

    .link-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(111,157,153,.40);
      box-shadow: 0 10px 22px rgba(71,103,102,.09);
    }

    .primary {
      grid-column: 1 / -1;
      color: white;
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      box-shadow: 0 10px 24px rgba(111,157,153,.22);
    }

    .primary:hover {
      border-color: transparent;
      box-shadow: 0 14px 28px rgba(111,157,153,.30);
    }

    .footer {
      position: relative;
      z-index: 1;
      padding-top: 1px;
      color: #849393;
      font-size: 11px;
      text-align: center;
    }

    .footer strong {
      color: var(--accent-2);
    }

    @media (max-width: 380px) {
      .dialog {
        padding: 19px;
        border-radius: 24px;
      }

      .info-grid,
      .links {
        grid-template-columns: 1fr;
      }

      .primary {
        grid-column: auto;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-1: #152120;
        --bg-2: #1c2b2a;
        --card: rgba(22, 32, 31, .96);
        --text: #ecf6f4;
        --muted: #9ab0ae;
        --line: rgba(143,179,177,.22);
      }

      body {
        background:
          radial-gradient(circle at 12% 12%, rgba(143,179,177,.08), transparent 30%),
          radial-gradient(circle at 86% 84%, rgba(143,179,177,.13), transparent 32%),
          linear-gradient(145deg, var(--bg-1), var(--bg-2));
      }

      .bio {
        color: #bdcecc;
      }

      .info-card,
      .link-btn {
        background: rgba(255,255,255,.035);
        color: var(--text);
      }

      .close {
        color: var(--text);
      }
    }
  </style>
</head>

<body>

  <!-- Demo trigger. Remove this button when integrating into your Android/WebView app. -->
  <button class="demo-trigger" onclick="openDeveloperDialog()">Developer Info</button>

  <div class="overlay" id="developerOverlay" aria-hidden="true">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="developerName">

      <button class="close" onclick="closeDeveloperDialog()" aria-label="Close">×</button>

      <div class="header">
        <div class="logo-wrap">
          <div class="logo-glow"></div>
          <div class="logo-orbit"></div>
          <img
            id="developerLogo"
            class="logo"
            src="https://i.ibb.co/HprvSfSX/favicon.jpg"
            alt="Sh. Tanzir logo"
          />
        </div>

        <div class="eyebrow" id="developerBrand">TanzirDev</div>
        <h1 id="developerName">Sh. Tanzir</h1>
        <p class="role" id="developerRole">App Developer & Creator</p>
      </div>

      <div class="bio" id="developerBio">
        Building useful apps, developer tools and creative digital experiences.
      </div>

      <div class="section-title">Developer Info</div>

      <div class="info-grid">
        <div class="info-card">
          <span class="label">Name</span>
          <span class="value" id="infoName">Sh. Tanzir</span>
        </div>

        <div class="info-card">
          <span class="label">Brand</span>
          <span class="value" id="infoBrand">TanzirDev</span>
        </div>

        <div class="info-card">
          <span class="label">Focus</span>
          <span class="value" id="infoFocus">Apps & Web</span>
        </div>

        <div class="info-card">
          <span class="label">GitHub</span>
          <span class="value">@ShTanzir</span>
        </div>
      </div>

      <div class="section-title">Connect</div>

      <div class="links">
        <a
          id="telegramBtn"
          class="link-btn primary"
          href="https://t.me/ShTanzir"
          target="_blank"
          rel="noopener noreferrer"
        >
          ✈️ Telegram
        </a>

        <a
          id="githubBtn"
          class="link-btn"
          href="https://github.com/ShTanzir"
          target="_blank"
          rel="noopener noreferrer"
        >
          ◈ GitHub
        </a>

        <a
          id="websiteBtn"
          class="link-btn"
          href="https://tanzirlen.netlify.app/"
          target="_blank"
          rel="noopener noreferrer"
        >
          🌐 Website
        </a>
      </div>

      <div class="footer">
        Created by <strong id="footerName">Sh. Tanzir</strong>
      </div>
    </section>
  </div>

  <script>
    /*
    ============================================================
      EASY CUSTOMIZATION
      শুধু এই CONFIG অংশটি edit করলেই হবে।
    ============================================================
    */
    const CONFIG = {
      name: "Sh. Tanzir",
      brand: "TanzirDev",
      role: "App Developer & Creator",

      // Remote logo
      logo: "https://i.ibb.co/HprvSfSX/favicon.jpg",

      bio: "Building useful apps, developer tools and creative digital experiences.",

      // Location intentionally removed.
      focus: "Apps & Web",

      links: {
        telegram: "https://t.me/ShTanzir",
        github: "https://github.com/ShTanzir",
        website: "https://tanzirlen.netlify.app/"
      },

      // Main colors based on the supplied favicon
      colors: {
        backgroundLight: "#eef4f2",
        backgroundSoft: "#dce8e5",
        accent: "#8fb3b1",
        accentDark: "#6f9d99",
        accentLight: "#b9d5d1"
      }
    };

    const overlay = document.getElementById("developerOverlay");

    function applyConfig() {
      document.documentElement.style.setProperty("--bg-1", CONFIG.colors.backgroundLight);
      document.documentElement.style.setProperty("--bg-2", CONFIG.colors.backgroundSoft);
      document.documentElement.style.setProperty("--accent", CONFIG.colors.accent);
      document.documentElement.style.setProperty("--accent-2", CONFIG.colors.accentDark);
      document.documentElement.style.setProperty("--accent-3", CONFIG.colors.accentLight);

      document.getElementById("developerLogo").src = CONFIG.logo;
      document.getElementById("developerBrand").textContent = CONFIG.brand;
      document.getElementById("developerName").textContent = CONFIG.name;
      document.getElementById("developerRole").textContent = CONFIG.role;
      document.getElementById("developerBio").textContent = CONFIG.bio;

      document.getElementById("infoName").textContent = CONFIG.name;
      document.getElementById("infoBrand").textContent = CONFIG.brand;
      document.getElementById("infoFocus").textContent = CONFIG.focus;

      document.getElementById("telegramBtn").href = CONFIG.links.telegram;
      document.getElementById("githubBtn").href = CONFIG.links.github;
      document.getElementById("websiteBtn").href = CONFIG.links.website;

      document.getElementById("footerName").textContent = CONFIG.name;
    }

    function openDeveloperDialog() {
      overlay.classList.add("show");
      overlay.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeDeveloperDialog() {
      overlay.classList.remove("show");
      overlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    overlay.addEventListener("click", function (event) {
      if (event.target === overlay) closeDeveloperDialog();
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") closeDeveloperDialog();
    });

    applyConfig();

    /*
      AUTO OPEN:
      Android/WebView-তে dialog automatically দেখাতে
      applyConfig(); এর পরে নিচের line uncomment করো:

      openDeveloperDialog();
    */
  </script>

</body>
</html>
