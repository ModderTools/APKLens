plugins { id 'com.android.application' }

// ----------------------------------------------------------------------------
// jadx-core is not published to Google Maven / Maven Central — its binaries ship
// as a GitHub release zip. fetchJadx downloads the official distribution and
// extracts the engine jar(s) into app/build/jadx-libs.
//
// IMPORTANT: the classpath must use fileTree(dir:..., include:['*.jar']),
// NOT files(dir). A bare directory on the Java classpath is treated as a
// package ROOT — jars inside it are invisible to javac. That exact mistake
// caused "package jadx.api does not exist".
// ----------------------------------------------------------------------------
def jadxVersion = '1.5.0'
def jadxLibsDir = layout.buildDirectory.dir('jadx-libs').get().asFile

// True when the directory holds at least one jar that really contains the engine.
def jadxEngineReady = {
    def jars = jadxLibsDir.listFiles()?.findAll { it.name.endsWith('.jar') } ?: []
    return jars.any { jar ->
        try {
            new java.util.zip.ZipFile(jar).withCloseable { zf ->
                zf.getEntry('jadx/api/JadxDecompiler.class') != null
            }
        } catch (Exception ignored) {
            false
        }
    }
}

tasks.register('fetchJadx') {
    description = 'Downloads the official jadx distribution and verifies the engine jar.'
    doLast {
        if (jadxEngineReady()) {
            logger.lifecycle('jadx engine jar present and verified — skipping download.')
            return
        }
        jadxLibsDir.mkdirs()
        jadxLibsDir.listFiles()?.each { it.delete() }   // clear stale/invalid extractions

        def zipFile = new File(jadxLibsDir, "jadx-${jadxVersion}.zip")
        def url = "https://github.com/skylot/jadx/releases/download/v${jadxVersion}/jadx-${jadxVersion}.zip"
        logger.lifecycle("Downloading jadx engine: ${url}")
        try {
            new URL(url).withInputStream { ins -> zipFile.withOutputStream { outs -> outs << ins } }
        } catch (Exception e) {
            throw new GradleException("Could not download jadx from ${url} " +
                    "(internet required on the first build). Cause: ${e.message}")
        }

        int count = 0
        new java.util.zip.ZipFile(zipFile).withCloseable { zf ->
            zf.entries().each { entry ->
                if (entry.isDirectory()) return
                String name = entry.getName()
                String base = name.substring(name.lastIndexOf('/') + 1)
                if (!base.endsWith('.jar')) return
                if (base.contains('jadx-gui')) return   // desktop Swing GUI — unusable on Android
                new File(jadxLibsDir, base).withOutputStream { outs ->
                    zf.getInputStream(entry).withCloseable { ins -> outs << ins }
                }
                count++
            }
        }
        zipFile.delete()

        if (!jadxEngineReady()) {
            throw new GradleException("Extracted ${count} jar(s) from the jadx distribution, but none " +
                    "contains jadx/api/JadxDecompiler — unexpected distribution layout. Please report this.")
        }
        logger.lifecycle("Extracted ${count} jadx jar(s) into ${jadxLibsDir} (engine verified).")
    }
}

// No outputs declaration: the jadxEngineReady() guard makes a verified no-op cheap,
// and running every build guarantees a stale/broken extraction is never trusted.

def jadxEngine = fileTree(dir: jadxLibsDir, include: ['*.jar']).builtBy('fetchJadx')

android {
    namespace 'com.apklens.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.apklens.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false   // R8 off: jadx uses reflection/ServiceLoader; correctness > size
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true   // jadx uses Java 11+ APIs (List.of, java.nio.file, …)
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/INDEX.LIST',
                         'META-INF/AL2.0', 'META-INF/LGPL2.1', 'module-info.class',
                         'META-INF/versions/**']
            merges += ['META-INF/services/**']   // keep jadx plugin ServiceLoader registrations
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation jadxEngine

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
