plugins { id 'com.android.application' }

// ----------------------------------------------------------------------------
// jadx-core ships as a merged GitHub-release jar containing the engine plus all
// runtime dependencies — including packages that are UNSAFE on Android:
//
//   • com/google/gson/**  — gson 2.10.1 calls Class.getModule() (Java 9+ JPMS,
//     absent on ALL Android versions) → NoSuchMethodError at runtime. Fixed
//     upstream in gson 2.11.0: we strip the bundled copy and supply the
//     Android-safe Maven version below.
//   • ch/qos/logback/**   — not Android-safe; slf4j falls back to its built-in
//     NOP provider when none is present (ApkLens keeps its own engine log).
//
// STRIP_SCHEMA is bumped whenever the drop-list changes — it invalidates any
// previously cached stripped jar so new entries are always applied.
// ----------------------------------------------------------------------------
def jadxVersion = '1.5.0'
def jadxLibsDir = layout.buildDirectory.dir('jadx-libs').get().asFile
def STRIP_SCHEMA = 'v2'
def finalJarName = "jadx-${jadxVersion}-android-${STRIP_SCHEMA}.jar"

def droppedPackages = [
        'com/formdev/',       // FlatLaf (Swing look-and-feel — jadx-gui only)
        'com/github/weisj/',  // JSVG (GUI icons)
        'com/apple/',         // Apple desktop stubs
        'com/google/gson/',   // replaced by Android-safe gson 2.11.0 (Maven, below)
        'ch/qos/logback/',    // removed — slf4j NOP fallback used instead
        'META-INF/versions/', // Java 9+ multi-release overrides
        'module-info.class'
]

def jarHasEngine = { File f ->
    try {
        new java.util.zip.ZipFile(f).withCloseable { zf ->
            zf.getEntry('jadx/api/JadxDecompiler.class') != null
        }
    } catch (Exception ignored) { false }
}

tasks.register('fetchJadx') {
    description = 'Downloads the official jadx distribution, strips unsafe/desktop packages, verifies the engine jar.'
    doLast {
        def finalJar = new File(jadxLibsDir, finalJarName)
        if (finalJar.exists() && jarHasEngine(finalJar)) {
            logger.lifecycle("jadx engine ready: ${finalJarName}")
            return
        }

        jadxLibsDir.mkdirs()

        // Reuse a previously downloaded fat jar when possible; otherwise download.
        def fatJar = jadxLibsDir.listFiles()?.find { it.name.endsWith('-all.jar') }
        if (fatJar == null) {
            jadxLibsDir.listFiles()?.each { it.delete() }
            def zipFile = new File(jadxLibsDir, "jadx-${jadxVersion}.zip")
            def url = "https://github.com/skylot/jadx/releases/download/v${jadxVersion}/jadx-${jadxVersion}.zip"
            logger.lifecycle("Downloading jadx engine: ${url}")
            try {
                new URL(url).withInputStream { ins -> zipFile.withOutputStream { outs -> outs << ins } }
            } catch (Exception e) {
                throw new GradleException("Could not download jadx from ${url}. Cause: ${e.message}")
            }
            new java.util.zip.ZipFile(zipFile).withCloseable { zf ->
                zf.entries().each { entry ->
                    if (entry.isDirectory()) return
                    String base = entry.name.substring(entry.name.lastIndexOf('/') + 1)
                    if (!base.endsWith('.jar') || base.contains('jadx-gui')) return
                    new File(jadxLibsDir, base).withOutputStream { outs ->
                        zf.getInputStream(entry).withCloseable { ins -> outs << ins }
                    }
                }
            }
            zipFile.delete()
            fatJar = jadxLibsDir.listFiles()?.find { it.name.endsWith('-all.jar') }
        }
        if (fatJar == null) {
            throw new GradleException("jadx distribution contained no -all.jar — unexpected layout.")
        }

        // ---- strip (MANDATORY: the Maven gson below must not duplicate bundled gson) ----
        def tmp = new File(jadxLibsDir, finalJarName + '.tmp')
        try {
            logger.lifecycle("Stripping unsafe/desktop packages from ${fatJar.name} …")
            new java.util.zip.ZipFile(fatJar).withCloseable { src ->
                new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(tmp)).withCloseable { out ->
                    src.entries().each { e ->
                        if (e.isDirectory()) return
                        String n = e.name
                        if (droppedPackages.any { n.startsWith(it) }) return
                        out.putNextEntry(new java.util.zip.ZipEntry(n))
                        src.getInputStream(e).withCloseable { ins -> out << ins }
                        out.closeEntry()
                    }
                }
            }
            if (!jarHasEngine(tmp)) throw new IllegalStateException("engine class missing after strip")
            java.nio.file.Files.move(tmp.toPath(), finalJar.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } catch (Exception ex) {
            tmp.delete()
            throw new GradleException("Stripping the jadx jar failed: ${ex.message}. " +
                    "This build requires the strip — the bundled gson is unsafe on Android.")
        }

        // Remove the fat jar and any stale artifacts.
        jadxLibsDir.listFiles()?.findAll { it.name != finalJarName }?.each { it.delete() }

        // ---- diagnostic: which remaining packages still reference Class.getModule()? ----
        def pkgCounts = [:]
        new java.util.zip.ZipFile(finalJar).withCloseable { zf ->
            zf.entries().each { e ->
                if (e.isDirectory() || !e.name.endsWith('.class')) return
                String s = new String(zf.getInputStream(e).withCloseable { it.bytes },
                        java.nio.charset.StandardCharsets.ISO_8859_1)
                if (s.contains('getModule')) {
                    def pkg = e.name.contains('/') ? e.name.substring(0, e.name.lastIndexOf('/')) : '(root)'
                    pkgCounts[pkg] = (pkgCounts[pkg] ?: 0) + 1
                }
            }
        }
        def leftovers = pkgCounts.keySet().findAll {
            it.startsWith('com/google/gson') || it.startsWith('ch/qos/logback')
        }
        if (leftovers) {
            throw new GradleException("Strip verification failed — unsafe packages remain: ${leftovers}")
        }
        pkgCounts.sort { -it.value }.take(12).each { pkg, cnt ->
            logger.warn("getModule ref (inert unless executed): ${pkg} — ${cnt} classes")
        }
        logger.lifecycle("jadx engine ready: ${finalJarName} (verified, unsafe packages stripped)")
    }
}

def jadxEngine = fileTree(dir: jadxLibsDir, include: [finalJarName]).builtBy('fetchJadx')

android {
    namespace 'com.apklens.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.apklens.app"
        minSdk 26              // DEX invoke-polymorphic (MethodHandle.invoke) requires API 26+
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/INDEX.LIST',
                         'META-INF/AL2.0', 'META-INF/LGPL2.1', 'module-info.class',
                         'META-INF/versions/**']
            merges += ['META-INF/services/**']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation jadxEngine

    // Android-safe Gson — 2.11.0 fixed the bundled 2.10.1 crash
    // (NoSuchMethodError on Class.getModule) on Android.
    // FIX: gson 2.11.0 transitively pulls error_prone_annotations, which the jadx
    // fat jar already bundles — exclude it or checkDebugDuplicateClasses fails.
    implementation('com.google.code.gson:gson:2.11.0') {
        exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
    }

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
