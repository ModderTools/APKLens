plugins { id 'com.android.application' }

// ----------------------------------------------------------------------------
// jadx-core is not published to Google Maven / Maven Central — its binaries ship
// as a GitHub release zip. fetchJadx downloads the official distribution and
// extracts the merged engine jar (jadx-x.y.z-all.jar).
//
// The merged jar bundles jadx-gui's DESKTOP dependencies (FlatLaf, JSVG, ...).
// Those classes contain MethodHandle.invoke/invokeExact call sites, which D8
// can only dex for min-api >= 26 (DEX invoke-polymorphic opcode exists only on
// Android 8+). Hence minSdk 26 below. We additionally strip the packages that
// are provably GUI-only (jadx-core is headless and cannot reference them) to
// reclaim APK space — with a safe fallback to the full jar on any failure.
//
// The classpath uses fileTree(dir, '*.jar') — a bare directory would be treated
// as a package root and its jars would be invisible to javac.
// ----------------------------------------------------------------------------
def jadxVersion = '1.5.0'
def jadxLibsDir = layout.buildDirectory.dir('jadx-libs').get().asFile

def jarHasEngine = { File f ->
    try {
        new java.util.zip.ZipFile(f).withCloseable { zf ->
            zf.getEntry('jadx/api/JadxDecompiler.class') != null
        }
    } catch (Exception ignored) { false }
}

def jadxEngineReady = {
    (jadxLibsDir.listFiles()?.findAll { it.name.endsWith('.jar') } ?: []).any { jarHasEngine(it) }
}

// Removes desktop-only packages from a *-all.jar, producing *-android.jar.
// Idempotent; falls back to keeping the full jar if rewriting fails.
def stripDesktopPackages = { File jar ->
    def stripped = new File(jadxLibsDir, jar.name.replace('-all.jar', '-android.jar'))
    if (stripped.exists() && !jarHasEngine(stripped)) {
        logger.lifecycle("Removing incomplete ${stripped.name}")
        stripped.delete()
    }
    if (!stripped.exists()) {
        logger.lifecycle("Stripping desktop-only classes from ${jar.name} …")
        def tmp = new File(jadxLibsDir, stripped.name + '.tmp')
        try {
            new java.util.zip.ZipFile(jar).withCloseable { src ->
                new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(tmp)).withCloseable { out ->
                    src.entries().each { e ->
                        if (e.isDirectory()) return
                        String n = e.getName()
                        boolean drop = n.startsWith('com/formdev/')      // FlatLaf (Swing L&F, gui-only)
                                || n.startsWith('com/github/weisj/')     // JSVG (gui icons)
                                || n.startsWith('com/apple/')            // Apple desktop stubs
                                || n.startsWith('META-INF/versions/')    // multi-release overrides
                                || n == 'module-info.class'
                        if (drop) return
                        out.putNextEntry(new java.util.zip.ZipEntry(n))
                        src.getInputStream(e).withCloseable { ins -> out << ins }
                        out.closeEntry()
                    }
                }
            }
            if (!jarHasEngine(tmp)) throw new IllegalStateException("engine class missing after strip")
            java.nio.file.Files.move(tmp.toPath(), stripped.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("Stripped jar written: ${stripped.name}")
        } catch (Exception ex) {
            logger.warn("jadx jar stripping failed (" + ex.message + "); keeping the full jar " +
                    "(minSdk 26 dexes it anyway).")
            tmp.delete()
            return
        }
    }
    if (stripped.exists() && jarHasEngine(stripped)) {
        jar.delete()
    }
}

tasks.register('fetchJadx') {
    description = 'Downloads the official jadx distribution, strips desktop-only packages, verifies the engine jar.'
    doLast {
        jadxLibsDir.mkdirs()

        // Normalize any previously extracted fat jar (idempotent, no re-download needed).
        jadxLibsDir.listFiles()?.findAll { it.name.endsWith('-all.jar') }?.each { stripDesktopPackages(it) }

        if (jadxEngineReady()) {
            logger.lifecycle('jadx engine jar present and verified — skipping download.')
            return
        }

        // Fresh download.
        jadxLibsDir.listFiles()?.each { it.delete() }
        def zipFile = new File(jadxLibsDir, "jadx-${jadxVersion}.zip")
        def url = "https://github.com/skylot/jadx/releases/download/v${jadxVersion}/jadx-${jadxVersion}.zip"
        logger.lifecycle("Downloading jadx engine: ${url}")
        try {
            new URL(url).withInputStream { ins -> zipFile.withOutputStream { outs -> outs << ins } }
        } catch (Exception e) {
            throw new GradleException("Could not download jadx from ${url} " +
                    "(internet required on the first build). Cause: ${e.message}")
        }

        int count = 0
        new java.util.zip.ZipFile(zipFile).withCloseable { zf ->
            zf.entries().each { entry ->
                if (entry.isDirectory()) return
                String name = entry.getName()
                String base = name.substring(name.lastIndexOf('/') + 1)
                if (!base.endsWith('.jar')) return
                if (base.contains('jadx-gui')) return   // (kept for future multi-jar distributions)
                new File(jadxLibsDir, base).withOutputStream { outs ->
                    zf.getInputStream(entry).withCloseable { ins -> outs << ins }
                }
                count++
            }
        }
        zipFile.delete()

        // Strip desktop packages from the freshly extracted fat jar.
        jadxLibsDir.listFiles()?.findAll { it.name.endsWith('-all.jar') }?.each { stripDesktopPackages(it) }

        if (!jadxEngineReady()) {
            throw new GradleException("Extracted ${count} jar(s) from the jadx distribution, but none " +
                    "contains jadx/api/JadxDecompiler — unexpected distribution layout. Please report this.")
        }
        logger.lifecycle("jadx engine ready in ${jadxLibsDir} (engine verified).")
    }
}

def jadxEngine = fileTree(dir: jadxLibsDir, include: ['*.jar']).builtBy('fetchJadx')

android {
    namespace 'com.apklens.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.apklens.app"
        minSdk 26              // REQUIRED: DEX invoke-polymorphic (MethodHandle.invoke)
                               // is only supported on Android 8.0 (API 26)+.
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false   // R8 off: jadx uses reflection/ServiceLoader; correctness > size
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true   // jadx uses Java 11+ APIs (List.of, java.nio.file, …)
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/INDEX.LIST',
                         'META-INF/AL2.0', 'META-INF/LGPL2.1', 'module-info.class',
                         'META-INF/versions/**']
            merges += ['META-INF/services/**']   // keep jadx plugin ServiceLoader registrations
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation jadxEngine

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
