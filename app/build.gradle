plugins { id 'com.android.application' }

android {
    namespace 'com.apklens.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.apklens.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false   // R8 off: jadx-core/dexlib2 use reflection; correctness > size here
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true   // jadx uses Java 11+ APIs (List.of etc.)
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE','META-INF/LICENSE.txt',
                         'META-INF/NOTICE','META-INF/NOTICE.txt','META-INF/INDEX.LIST',
                         'META-INF/AL2.0','META-INF/LGPL2.1','module-info.class']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // The decompilation engine: DEX parsing, Java reconstruction, resource/manifest decoding.
    implementation 'io.github.jadx:jadx-core:1.5.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
