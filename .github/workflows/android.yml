name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare launcher icon
        run: |
          if [ -f app/src/main/res/drawable/logo.png ]; then
            rm -f app/src/main/res/drawable/logo.xml
            echo "Using logo.png as the launcher icon."
          else
            echo "logo.png not found — building with the vector placeholder (logo.xml)."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          cache-read-only: false

      - name: Build (debug + release)
        run: gradle assembleDebug assembleRelease --stacktrace --warning-mode all

      # ---- Sign the release APK when keystore secrets are configured ----
      - name: Sign release APK
        if: env.KEYSTORE_BASE64 != ''
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out ApkLens-release-signed.apk aligned.apk
          "$BT/apksigner" verify ApkLens-release-signed.apk
          rm -f release.keystore aligned.apk   # never persist the keystore in the workspace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ApkLens-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload signed release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ApkLens-release-signed
          path: ApkLens-release-signed.apk

      - name: Upload unsigned release APK (fallback)
        if: env.KEYSTORE_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: ApkLens-release-unsigned
          path: app/build/outputs/apk/release/*.apk
